name: all-pages
description: Screenshot every page in the app for UX review
default_delay: 400

actions:
  - type: Wait
    value: "1000"

  # Resume / My CV page
  - type: Navigate
    value: resume
  - type: Wait
    value: "800"
    
  - type: Screenshot
    value: page-resume

  # JobML linked prose/evidence editor
  - type: Navigate
    value: jobml
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-jobml

  # Jobs page
  - type: Navigate
    value: jobs
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-jobs

  - type: Navigate
    value: search
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-search

  # Apply page
  - type: Navigate
    value: apply
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-apply

  - type: Navigate
    value: pipeline
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-pipeline

  - type: Navigate
    value: mydata
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-mydata

  - type: Navigate
    value: career
  - type: Wait
    value: "800"
  - type: Screenshot
    value: page-career

  # Profile page
  - type: Navigate
