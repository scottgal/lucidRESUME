name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore lucidRESUME.sln

      - name: Build desktop solution
        run: dotnet build lucidRESUME.sln -c Release --no-restore --warnaserror

      - name: Verify formatting
        run: dotnet format lucidRESUME.sln --verify-no-changes --no-restore --severity warn

      - name: Test
        run: dotnet test lucidRESUME.sln -c Release --no-build --verbosity normal

      - name: Audit dependencies
        run: dotnet list lucidRESUME.sln package --vulnerable --include-transitive
