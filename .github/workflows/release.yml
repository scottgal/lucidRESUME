name: Release - App Archives

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without leading v (for example, 1.0.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/lucidRESUME/lucidRESUME.csproj

jobs:
  release-validation:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore lucidRESUME.sln
      - name: Build
        run: dotnet build lucidRESUME.sln -c Release --no-restore
      - name: Test
        run: dotnet test lucidRESUME.sln -c Release --no-build
      - name: Audit dependencies
        run: dotnet list lucidRESUME.sln package --vulnerable --include-transitive

  publish-app:
    name: Publish ${{ matrix.rid }}
    needs: release-validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04
            rid: linux-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            "VERSION=$("${{ github.ref_name }}".TrimStart('v'))" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ matrix.rid }}

      - name: Publish self-contained app (non-macOS)
        if: ${{ !startsWith(matrix.rid, 'osx-') }}
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -o artifacts/publish/${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish self-contained app (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -o artifacts/publish/${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Build and ad-hoc sign macOS app bundle
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="artifacts/bundle/lucidRESUME.app"
          contents="$bundle/Contents"
          mkdir -p "$contents/MacOS" "$contents/Resources"
          cp "artifacts/publish/${{ matrix.rid }}/lucidRESUME" "$contents/MacOS/lucidRESUME"
          cat > "$contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>lucidRESUME</string>
            <key>CFBundleExecutable</key><string>lucidRESUME</string>
            <key>CFBundleIdentifier</key><string>net.mostlylucid.lucidresume</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>lucidRESUME</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.VERSION }}</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.VERSION }}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - --timestamp=none "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Audit shipped import and matching assets
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          publish="artifacts/publish/$rid"
          host_arch="$(uname -m)"
          compatible=true
          if [[ "$rid" == *-arm64 && "$host_arch" != "arm64" && "$host_arch" != "aarch64" ]]; then compatible=false; fi
          if [[ "$rid" == *-x64 && "$host_arch" == "arm64" ]]; then compatible=false; fi
          if [[ "$compatible" == true ]]; then
            executable="$publish/lucidRESUME"
            if [[ "$rid" == win-* ]]; then executable="${executable}.exe"; fi
            "$executable" --asset-audit
          elif [[ "$rid" != osx-* ]]; then
            test -s "$publish/Resources/taxonomies/skill-taxonomy.txt"
            test -s "$publish/Resources/taxonomies/skill-priorities.txt"
            test -s "$publish/Resources/taxonomies/role-archetypes.txt"
            test -s "$publish/Resources/github-language-map.txt"
            echo "Cross-architecture build: verified external product assets without launching $rid."
          else
            echo "Cross-architecture macOS build: content is embedded; source audit passed in release-validation."
          fi
          if find "$publish" -type f \( -name 'data.db' -o -name '*.jobml.md' -o -name '*openapikey*' \) | grep -q .; then
            echo "Release contains user data, a ledger snapshot, or a credential-like file." >&2
            exit 1
          fi

      - name: Smoke-test packaged macOS app
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          if { [ "${{ matrix.rid }}" = "osx-arm64" ] && [ "$host_arch" != "arm64" ]; } || \
             { [ "${{ matrix.rid }}" = "osx-x64" ] && [ "$host_arch" = "arm64" ]; }; then
            echo "Skipping launch test for ${{ matrix.rid }} on $host_arch; bundle signature was still verified."
            exit 0
          fi
          data_dir="$(mktemp -d)"
          output_dir="$(mktemp -d)"
          LUCIDRESUME_DATA_DIR="$data_dir" \
            LUCIDRESUME_Startup__AutoDownloadModels=false \
            artifacts/bundle/lucidRESUME.app/Contents/MacOS/lucidRESUME \
            --ux-test --script "$GITHUB_WORKSPACE/ux-scripts/all-pages.yaml" --output "$output_dir"

      - name: Create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $version = "${{ steps.version.outputs.VERSION }}"
          $rid = "${{ matrix.rid }}"
          $name = "lucidRESUME-$version-$rid"
          $publishDir = Resolve-Path "artifacts/publish/$rid"
          $stagingRoot = Resolve-Path "artifacts/release"
          $staging = Join-Path $stagingRoot $name
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          if ($rid -like "osx-*") {
            Copy-Item -Path "artifacts/bundle/lucidRESUME.app" -Destination $staging -Recurse -Force
            @"
          lucidRESUME for macOS

          Control-click lucidRESUME.app, choose Open, then confirm the first launch.
          If macOS still reports a quarantined library, run this only on the extracted app:

            xattr -dr com.apple.quarantine ./lucidRESUME.app

          The bundle is ad-hoc signed but not Apple-notarized.
          "@ | Set-Content (Join-Path $staging "README-FIRST.txt")
          } else {
            Copy-Item -Path "$publishDir/*" -Destination $staging -Recurse -Force
          }
          if ($rid -like "win-*") {
            # Windows: zip only
            Compress-Archive -Path $staging -DestinationPath "artifacts/release/$name.zip" -Force
            Get-FileHash "artifacts/release/$name.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $name.zip" } | Set-Content "artifacts/release/$name.zip.sha256"
          } else {
            # macOS / Linux: tar.gz only
            tar -czf "artifacts/release/$name.tar.gz" -C "artifacts/release" $name
            Get-FileHash "artifacts/release/$name.tar.gz" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $name.tar.gz" } | Set-Content "artifacts/release/$name.tar.gz.sha256"
          }

      - name: Upload app archives
        uses: actions/upload-artifact@v7
        with:
          name: lucidRESUME-${{ matrix.rid }}-archives
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
          if-no-files-found: error

  docs-archive:
    name: Build single-page docs archive
    needs: release-validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build single-page documentation
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          name="lucidRESUME-${version}-docs"
          out_dir="artifacts/docs/${name}"
          mkdir -p "$out_dir" artifacts/release
          {
            echo "# lucidRESUME Documentation Archive"
            echo
            echo "Version: ${version}"
            echo
          echo "Generated from the product guide, architecture, product-assets contract, user manual, compiler guide, JobML and cJobML specifications, and GitHub extension."
            echo
            echo "---"
            echo
            sed -n '1,$p' README.md
            echo
            echo "---"
            echo
            sed -n '1,$p' docs/architecture.md
            echo
            echo "---"
            echo
            sed -n '1,$p' docs/product-assets.md
            echo
            echo "---"
            echo
            sed -n '1,$p' src/lucidRESUME/Resources/user-manual.md
            echo
            echo "---"
            echo
            sed -n '1,$p' docs/jobml-web-compiler.md
            echo
            echo "---"
            echo
            sed -n '1,$p' docs/jobml-0.1-specification.md
            echo
            echo "---"
            echo
            sed -n '1,$p' docs/cjobml-0.1-specification.md
            echo
            echo "---"
            echo
            sed -n '1,$p' docs/jobml-github-extension-0.1.md
          } > "${out_dir}/lucidRESUME-docs-single-page.md"
          cp README.md docs/architecture.md docs/product-assets.md docs/jobml-web-compiler.md \
            docs/jobml-0.1.md docs/jobml-0.1-specification.md \
            docs/cjobml-0.1-specification.md docs/jobml-github-extension-0.1.md docs/jobml-0.1.schema.json \
            src/lucidRESUME/Resources/user-manual.md "$out_dir/"
          (cd artifacts/docs && zip -qr "../release/${name}.zip" "$name")
          tar -czf "artifacts/release/${name}.tar.gz" -C artifacts/docs "$name"
          sha256sum "artifacts/release/${name}.zip" > "artifacts/release/${name}.zip.sha256"
          sha256sum "artifacts/release/${name}.tar.gz" > "artifacts/release/${name}.tar.gz.sha256"

      - name: Upload docs archive
        uses: actions/upload-artifact@v7
        with:
          name: lucidRESUME-docs-archive
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [publish-app, docs-archive]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/downloaded
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > artifacts/release-notes.md <<EOF
          ## lucidRESUME ${version}

          Local-first resume editing with human-owned prose and evidence-linked JobML for ATS and AI systems.

          EOF

          version_notes="docs/release-notes/v${version}.md"
          if [ -f "$version_notes" ]; then
            sed '1{/^# /d;}' "$version_notes" >> artifacts/release-notes.md
            cat >> artifacts/release-notes.md <<EOF

          EOF
          fi

          cat >> artifacts/release-notes.md <<EOF

          ### Downloads

          Pick the archive that matches your machine:

          | System | Runtime |
          |--------|---------|
          | Windows Intel/AMD | \`win-x64\` |
          | Windows ARM | \`win-arm64\` |
          | macOS Intel | \`osx-x64\` |
          | macOS Apple Silicon | \`osx-arm64\` |
          | Linux Intel/AMD | \`linux-x64\` |
          | Linux ARM | \`linux-arm64\` |

          Windows builds are \`.zip\`, macOS and Linux are \`.tar.gz\`. Each archive has a matching \`.sha256\` checksum file. The docs archive includes a single-page Markdown reference, \`lucidRESUME-docs-single-page.md\`.

          ### Basic Usage

          1. Extract the archive into a folder you control.
          2. On macOS, Control-click \`lucidRESUME.app\` and choose Open. On Windows or Linux, run the \`lucidRESUME\` executable.
          3. Import a PDF, DOCX, or TXT resume on the My CV page.
          4. Add a job description from pasted text or a job URL.
          5. Use Jobs for match scoring, Project for evidence-backed projection, and Pipeline for application tracking.

          ### macOS Gatekeeper

          The macOS bundle is ad-hoc signed but not Apple-notarized. Control-click \`lucidRESUME.app\`, choose Open, and confirm once. If macOS still reports a quarantined library, use this per-app exception:

          \`\`\`bash
          xattr -dr com.apple.quarantine ~/Applications/lucidRESUME.app
          \`\`\`

          ### Configuration

          | Area | Default | How to configure |
          |------|---------|------------------|
          | Local AI | LLamaSharp with grug 9B | Download the optional GGUF model from Profile. It assists ingestion and can perform bounded edits of already-selected evidence. Rendering never re-infers evidence. |
          | Cloud AI | Off | Add Anthropic or OpenAI API keys with user secrets, environment variables, or the Profile page. |
          | PDF layout | Local parser fallback | Enable Docling for ML-based layout extraction on complex PDFs. |
          | Embeddings and NER | Auto-download on first run | Allow the first-run model download, or pre-populate the app data model cache. |
          | Data store | Local SQLite database | Back up \`data.db\` from the app data folder for migration or restore. |
          | Email tracking | Off | Configure IMAP host, port, username, and app password in Profile. |

          ### Useful Commands

          \`\`\`bash
          # Verify a checksum on macOS or Linux
          shasum -a 256 lucidRESUME-${version}-osx-arm64.tar.gz

          # Optional alternative local provider
          ollama serve
          ollama pull qwen3.5:4b

          # Optional Docling container for complex PDF layout detection
          docker run -d --name docling-serve -p 5001:5001 quay.io/docling-project/docling-serve:latest
          \`\`\`
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/downloaded/*
          body_path: artifacts/release-notes.md
          generate_release_notes: true
